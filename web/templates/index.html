<!DOCTYPE html>
<html>
<head>
    <title>DASH ORG++</title>

    <style>
        body {
            background: #0b0f19;
            color: white;
            font-family: Arial;
            text-align: center;
        }

        .card {
            background: #1c2333;
            margin: 10px auto;
            padding: 15px;
            width: 400px;
            border-radius: 12px;
        }

        .rank {
            color: #00ffcc;
            font-size: 20px;
        }

        a {
            color: #4da6ff;
            text-decoration: none;
        }
    </style>
</head>

<body>

<h1>🏆 DASH ORG++ LEADERBOARD</h1>

{% for user_id, data in leaderboard %}

<div class="card">

    <div class="rank">
        Player: {{ user_id }}
    </div>

    <p>🏆 Wins: {{ data.wins }}</p>
    <p>💀 Losses: {{ data.losses }}</p>
    <p>📊 ELO: {{ data.elo }}</p>

    <a href="/player/{{ user_id }}">View Profile</a>

</div>

{% endfor %}

</body>
</html>
